version: '3.8'

services:
  message-broker:
    image: rabbitmq:3-management-alpine
    container_name: polyglider_broker
    ports:
      - "5672:5672"   # AMQP protocol port
      - "15672:15672" # Management UI dashboard
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest

  postgres:
    image: postgres:16-alpine
    container_name: polyglider_db
    ports:
      - "5432:5432"   # Standard PostgreSQL port
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=polyglider_inventory
    volumes:
      - postgres_data:/var/lib/postgresql/data

  analytics-worker:
    build: ./analytics-worker-python
    profiles:
      - analytics
    environment:
      - RABBITMQ_HOST=message-broker
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
      - SUMMARY_EVERY=10
    depends_on:
      - message-broker
    restart: on-failure

volumes:
  rabbitmq_data:
  postgres_data: