services:
  message-broker:
    image: rabbitmq:3-management-alpine
    container_name: polyglider_broker
    ports:
      - "127.0.0.1:5672:5672"   # AMQP protocol port (localhost only)
      - "127.0.0.1:15672:15672" # Management UI dashboard (localhost only)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-guest}
    mem_limit: 512m
    cpus: 1.0

  postgres:
    image: postgres:16-alpine
    container_name: polyglider_db
    ports:
      - "127.0.0.1:5432:5432"   # Standard PostgreSQL port (localhost only)
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-polyglider_inventory}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 512m
    cpus: 1.0

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: polyglider_prometheus
    ports:
      - "127.0.0.1:9090:9090" # Prometheus UI (localhost only)
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    # The Scala consumer runs on the host (sbt run), not in this compose file; this lets
    # Prometheus reach its /metrics endpoint on the host via host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 256m
    cpus: 0.5

  nginx:
    image: nginx:1.27-alpine
    container_name: polyglider_nginx
    profiles: ["containerized"]
    ports:
      - "127.0.0.1:80:80" # The only externally-exposed entry point to the gateway
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway
    mem_limit: 128m
    cpus: 0.25

  redis:
    image: redis:7-alpine
    container_name: polyglider_redis
    ports:
      - "127.0.0.1:6379:6379"
    # No volume: rate-limit counters are short-lived (1-minute TTL) and fine to lose on restart.
    mem_limit: 128m
    cpus: 0.25

  gateway:
    build: ./gateway-api-cs
    profiles: ["containerized"]
    environment:
      - RABBITMQ__HOST=message-broker
      - RABBITMQ__PORT=5672
      - RABBITMQ__USER=${RABBITMQ_USER:-guest}
      - RABBITMQ__PASSWORD=${RABBITMQ_PASS:-guest}
      - REDIS__CONNECTIONSTRING=redis:6379
    depends_on:
      - message-broker
      - redis
    mem_limit: 256m
    cpus: 0.5

  engine:
    build: ./processing-engine-scala
    profiles: ["containerized"]
    environment:
      - RABBIT_HOST=message-broker
      - RABBIT_PORT=5672
      - RABBIT_USER=${RABBITMQ_USER:-guest}
      - RABBIT_PASS=${RABBITMQ_PASS:-guest}
      - DB_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-polyglider_inventory}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    depends_on:
      - message-broker
      - postgres
    mem_limit: 512m
    cpus: 1.0

  grafana:
    image: grafana/grafana:11.3.0
    container_name: polyglider_grafana
    ports:
      - "127.0.0.1:3000:3000" # Grafana UI (localhost only)
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    mem_limit: 256m
    cpus: 0.5

volumes:
  rabbitmq_data:
  postgres_data:
  prometheus_data:
  grafana_data:
