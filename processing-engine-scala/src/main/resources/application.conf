app {
  rabbitmq {
    host = "127.0.0.1"
    host = ${?RABBIT_HOST}
    port = 5672
    port = ${?RABBIT_PORT}
    user = "guest"
    user = ${?RABBIT_USER}
    password = "guest"
    password = ${?RABBIT_PASS}
    queue = "orders.placed"
    exchange = "orders.exchange"
    routing-key = "orders.placed"
  }

  db {
    url = "jdbc:postgresql://localhost:5432/polyglider_inventory"
    url = ${?DB_URL}
    user = "postgres"
    user = ${?DB_USER}
    password = "postgres"
    password = ${?DB_PASSWORD}
    runMigrations = true
    pool-size = 8
    pool-size = ${?DB_POOL_SIZE}
    # SSL mode: disable | allow | prefer | require | verify-ca | verify-full
    # Override via DB_SSL_MODE env var; defaults to "disable" for local dev
    ssl-mode = "disable"
    ssl-mode = ${?DB_SSL_MODE}
  }

  consumer {
    queue-size = 1000
    workers = 4
    summary-every = 10

    retry {
      max-retries = 5
      base-delay-ms = 1000
      backoff-multiplier = 3.0
      max-jitter-ms = 250
    }
  }

  reprocessor {
    max-retries = 3
    base-delay-ms = 10000
    backoff-multiplier = 2.0
    max-jitter-ms = 1000
  }

  circuit-breaker {
    # Trip to open after this many consecutive Postgres write failures.
    max-failures = 5
    # How long the breaker stays open before allowing a half-open trial call.
    reset-timeout-ms = 30000
  }

  metrics {
    # Port the /metrics HTTP endpoint binds on, scraped by Prometheus.
    port = 9100
    port = ${?METRICS_PORT}
    # How often the dlx.orders.placed queue depth gauge is refreshed.
    dlq-poll-interval-ms = 15000
    dlq-poll-interval-ms = ${?METRICS_DLQ_POLL_INTERVAL_MS}
  }
}
