app {
  rabbitmq {
    host = "127.0.0.1"
    host = ${?RABBIT_HOST}
    port = 5672
    port = ${?RABBIT_PORT}
    user = "guest"
    user = ${?RABBIT_USER}
    password = "guest"
    password = ${?RABBIT_PASS}
    queue = "orders.placed"
    exchange = "orders.exchange"
    routing-key = "orders.placed"
  }

  db {
    url = "jdbc:postgresql://localhost:5432/polyglider_inventory"
    url = ${?DB_URL}
    user = "postgres"
    user = ${?DB_USER}
    password = "postgres"
    password = ${?DB_PASSWORD}
    runMigrations = true
  }

  consumer {
    queue-size = 1000
    workers = 4
    summary-every = 10
  }
}
