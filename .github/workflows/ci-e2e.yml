name: E2E CI

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: End-to-end pipeline test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run end-to-end test
        run: ./tools/e2e-test.sh

      - name: Capture service logs on failure
        if: failure()
        run: |
          mkdir -p logs
          for service in gateway engine message-broker postgres nginx redis; do
            docker compose -f docker-compose.yml --profile containerized logs --no-color --timestamps "$service" > "logs/${service}.log" 2>&1 || true
          done

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-logs
          path: logs/

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.yml --profile containerized down
