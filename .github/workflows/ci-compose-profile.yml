name: Compose Profile CI

on:
  push:
    branches-ignore: [ "main" ]
    paths:
      - "docker-compose.yml"
      - "tools/check-compose-profile.sh"
  pull_request:
    branches: [ "main" ]
    paths:
      - "docker-compose.yml"
      - "tools/check-compose-profile.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Verify containerized-only services stay profile-scoped
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check compose profile scoping
        run: ./tools/check-compose-profile.sh
