# Load balances across however many `gateway` replicas exist
# (`docker compose up -d --scale gateway=N --build`). A plain `server gateway:8080;` only
# resolves the hostname once at startup via the OS resolver, which Docker's embedded DNS
# answers with a single address -- not the full set of replica IPs. `resolve` (nginx >=1.27.3,
# open source) re-resolves "gateway" against Docker's embedded DNS (127.0.0.11) on the
# `valid` interval and updates the peer set in place, so scaling up/down is picked up without
# restarting nginx.
resolver 127.0.0.11 valid=10s;

upstream gateway_upstream {
    zone gateway_zone 64k;
    server gateway:8080 resolve;
}

server {
    listen 80;

    # nginx OSS has no active health-check directive (that's an nginx Plus feature). A dead
    # replica is only routed around passively, after a request to it has already failed --
    # proxy_next_upstream below retries the next peer for that one request. There is no
    # background probing that removes a replica before traffic hits it.
    proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;

    location / {
        proxy_pass http://gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
